<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Snake Evolution — Live Broadcast</title>
<meta name="description" content="A perpetual Red vs Blue snake evolution simulation running live on the server, broadcast to every visitor.">
<style>
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&display=swap');
  :root{
    --bg:#0b0d10; --panel:#13161b; --panel-line:#23272e; --ink:#d7dbe0; --dim:#7a8290;
    --red:#ff4d4f; --red-dim:#7a2426; --blue:#3fa9ff; --blue-dim:#1d4a73; --apple:#f4c542;
    --mono:'JetBrains Mono','SF Mono',Consolas,'Courier New',monospace;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;background:var(--bg);color:var(--ink);font-family:var(--mono);
    display:flex;flex-direction:column;align-items:center;padding:24px 16px 48px;
    min-height:100vh;
  }

  /* ── Header ── */
  .header{display:flex;flex-direction:column;align-items:center;margin-bottom:18px;}
  h1{font-size:15px;letter-spacing:.14em;text-transform:uppercase;margin:0 0 0;font-weight:700;}
  h1 span.r{color:var(--red)} h1 span.b{color:var(--blue)}
  .live{
    display:inline-flex;align-items:center;gap:6px;font-size:10px;
    color:#ff6b6b;letter-spacing:.1em;margin-left:10px;
  }
  .live .dot{
    width:6px;height:6px;border-radius:50%;background:#ff4d4f;
    animation:pulse 1.4s infinite;
  }
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}

  /* ── Board ── */
  .board-wrap{display:flex;flex-direction:column;align-items:center;gap:10px;width:100%;max-width:900px;}
  #stage{
    position:relative;border:1px solid var(--panel-line);border-radius:8px;
    overflow:hidden;background:#0e1013;width:100%;
    box-shadow:0 0 40px rgba(63,169,255,.05),0 0 80px rgba(255,77,79,.04);
  }
  canvas{display:block;width:100%;height:auto;}

  /* ── Stats panel ── */
  .panel{background:var(--panel);border:1px solid var(--panel-line);border-radius:8px;}
  .stats{display:flex;width:100%;font-size:12px;flex-wrap:wrap;}
  .stat{flex:1;min-width:110px;padding:10px 14px;border-right:1px solid var(--panel-line);}
  .stat:last-child{border-right:none;}
  .stat .k{color:var(--dim);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;margin-bottom:3px;}
  .stat .v{font-size:15px;font-weight:700;white-space:nowrap;}
  .stat.r .v{color:var(--red)} .stat.b .v{color:var(--blue)}

  /* ── Clock ── */
  .clock-wrap{
    width:100%;padding:10px 16px;
    display:flex;align-items:center;justify-content:center;gap:0;
    border-top:1px solid var(--panel-line);flex-wrap:wrap;
  }
  .clock-unit{display:flex;flex-direction:column;align-items:center;padding:4px 10px;}
  .clock-unit .cv{font-size:22px;font-weight:700;color:var(--ink);letter-spacing:.02em;line-height:1;}
  .clock-unit .ck{font-size:8px;color:var(--dim);letter-spacing:.1em;text-transform:uppercase;margin-top:3px;}
  .clock-sep{font-size:20px;color:var(--panel-line);align-self:flex-start;padding-top:6px;font-weight:700;}

  /* ── Legend & meta ── */
  .legend{display:flex;gap:16px;font-size:10.5px;color:var(--dim);flex-wrap:wrap;justify-content:center;}
  .legend .dot2{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:5px;vertical-align:middle;}
  .meta{color:var(--dim);font-size:10px;margin-top:4px;text-align:center;}
  .offline{
    color:#ff8a80;font-size:11px;margin-top:6px;display:none;
    padding:6px 14px;background:rgba(255,77,79,.08);border:1px solid rgba(255,77,79,.2);border-radius:6px;
  }
</style>
</head>
<body>

<div class="header">
  <h1>
    <span class="r">RED</span> vs <span class="b">BLUE</span> — Snake Evolution
    <span class="live"><span class="dot"></span>LIVE</span>
  </h1>
</div>

<div class="board-wrap">
  <div id="stage"><canvas id="c"></canvas></div>

  <div class="panel" style="width:100%;padding:0;">
    <div class="stats">
      <div class="stat r"><div class="k">Red population</div><div class="v" id="redPop">–</div></div>
      <div class="stat b"><div class="k">Blue population</div><div class="v" id="bluePop">–</div></div>
      <div class="stat"><div class="k">Apples eaten</div><div class="v" id="applesEaten">–</div></div>
    </div>
    <!-- Clock row -->
    <div class="clock-wrap" id="clockWrap">
      <div class="clock-unit"><div class="cv" id="ck-yr">0</div><div class="ck">Yr</div></div>
      <div class="clock-sep">:</div>
      <div class="clock-unit"><div class="cv" id="ck-mo">0</div><div class="ck">M</div></div>
      <div class="clock-sep">:</div>
      <div class="clock-unit"><div class="cv" id="ck-d">0</div><div class="ck">D</div></div>
      <div class="clock-sep">:</div>
      <div class="clock-unit"><div class="cv" id="ck-h">00</div><div class="ck">Hrs</div></div>
      <div class="clock-sep">:</div>
      <div class="clock-unit"><div class="cv" id="ck-min">00</div><div class="ck">Min</div></div>
      <div class="clock-sep">:</div>
      <div class="clock-unit"><div class="cv" id="ck-sec">00</div><div class="ck">Sec</div></div>
    </div>
  </div>

  <div class="legend">
    <span><span class="dot2" style="background:var(--red)"></span>Red — fast, needs runway to turn</span>
    <span><span class="dot2" style="background:var(--blue)"></span>Blue — nimble, slow mover</span>
    <span><span class="dot2" style="background:var(--apple)"></span>Apple</span>
  </div>
  <div class="meta" id="startedMeta"></div>
  <div class="offline" id="offlineMsg">Lost connection to the broadcast — retrying…</div>
</div>

<script>
(function(){
  "use strict";
  const canvasEl = document.getElementById('c');
  const ctx2d = canvasEl.getContext('2d');
  const offlineMsg = document.getElementById('offlineMsg');

  // --- Live playback model -------------------------------------------
  let liveSnakes = new Map();   // id -> { species, birth, segments:[{x,y},...] }
  let liveApples = new Map();   // "x,y" -> {x,y}
  let cols = 70, rows = 45, lifespanMs = 30000;
  let appleEatenCount = 0;
  let startedAt = null;

  let playback = null; // { events, windowStartGameTime, windowMs, clientAnchorMs, appliedIndex }

  // ── Clock display ──────────────────────────────────────────────────
  function setClockPart(id, val, pad){
    const el = document.getElementById(id);
    if(el) el.textContent = pad ? String(val).padStart(2,'0') : String(val);
  }

  function updateClock(ms){
    let totalSec = Math.floor(ms / 1000);
    const years  = Math.floor(totalSec / 31536000); totalSec -= years  * 31536000;
    const months = Math.floor(totalSec / 2592000);  totalSec -= months * 2592000;
    const days   = Math.floor(totalSec / 86400);    totalSec -= days   * 86400;
    const hours  = Math.floor(totalSec / 3600);     totalSec -= hours  * 3600;
    const minutes= Math.floor(totalSec / 60);
    const seconds= totalSec % 60;
    setClockPart('ck-yr',  years,   false);
    setClockPart('ck-mo',  months,  false);
    setClockPart('ck-d',   days,    false);
    setClockPart('ck-h',   hours,   true);
    setClockPart('ck-min', minutes, true);
    setClockPart('ck-sec', seconds, true);
  }

  const STAGE_COLORS = {
    red:  { new:{head:'#ff9a9c',body:'#a35456'}, mid:{head:'#ff4d4f',body:'#7a2426'}, old:{head:'#b3272a',body:'#420f10'} },
    blue: { new:{head:'#8fd0ff',body:'#3f6f8f'}, mid:{head:'#3fa9ff',body:'#1d4a73'}, old:{head:'#1f6aa8',body:'#0f2c42'} },
  };
  function lifeStage(birth, gameTimeNow){
    const age = gameTimeNow - birth;
    const third = lifespanMs/3;
    if(age < third) return 'new';
    if(age < 2*third) return 'mid';
    return 'old';
  }

  // Event shapes: ['m',id,t,x,y,ate] | ['b',id,t,species,segsFlat] | ['d',id,t] | ['as',t,x,y]
  function eventTime(e){ return e[0] === 'as' ? e[1] : e[2]; }

  function applyEvent(e){
    const type = e[0];
    if(type === 'm'){
      const id = e[1], x = e[3], y = e[4], ate = e[5];
      const snake = liveSnakes.get(id);
      if(!snake) return;
      snake.segments.unshift({x, y});
      if(ate){ liveApples.delete(x+','+y); appleEatenCount++; }
      else { snake.segments.pop(); }
    } else if(type === 'b'){
      const id = e[1], t = e[2], species = e[3], segsFlat = e[4];
      liveSnakes.set(id, { species, birth: t, segments: segsFlat.map(p => ({x:p[0], y:p[1]})) });
    } else if(type === 'd'){
      liveSnakes.delete(e[1]);
    } else if(type === 'as'){
      const x = e[2], y = e[3];
      liveApples.set(x+','+y, {x, y});
    }
  }

  function loadPacket(packet, baseAppleEatenCount){
    liveSnakes = new Map();
    for(const s of packet.baseSnakes){
      liveSnakes.set(s.id, { species: s.species, birth: s.birth, segments: s.segments.map(p=>({x:p.x,y:p.y})) });
    }
    liveApples = new Map();
    for(const a of packet.baseApples) liveApples.set(a.x+','+a.y, {x:a.x, y:a.y});
    appleEatenCount = baseAppleEatenCount;
    playback = {
      events: packet.events,
      windowStartGameTime: packet.windowStartGameTime,
      windowMs: packet.windowMs,
      clientAnchorMs: performance.now(),
      appliedIndex: 0,
    };
  }

  function currentGameTime(){
    if(!playback) return 0;
    const elapsed = Math.min(performance.now() - playback.clientAnchorMs, playback.windowMs);
    return playback.windowStartGameTime + elapsed;
  }

  function stepPlayback(){
    if(!playback) return;
    const target = currentGameTime();
    const evs = playback.events;
    while(playback.appliedIndex < evs.length && eventTime(evs[playback.appliedIndex]) <= target){
      applyEvent(evs[playback.appliedIndex]);
      playback.appliedIndex++;
    }
  }

  function render(){
    const targetW = Math.min(900, window.innerWidth - 32);
    const cellSize = Math.max(3, Math.floor(targetW / cols));
    canvasEl.width = cols*cellSize;
    canvasEl.height = rows*cellSize;

    ctx2d.fillStyle = '#0e1013';
    ctx2d.fillRect(0,0,canvasEl.width,canvasEl.height);

    // subtle grid lines
    ctx2d.strokeStyle = 'rgba(255,255,255,0.02)';
    ctx2d.lineWidth = 0.5;
    for(let x=0;x<=cols;x++){ ctx2d.beginPath();ctx2d.moveTo(x*cellSize,0);ctx2d.lineTo(x*cellSize,rows*cellSize);ctx2d.stroke(); }
    for(let y=0;y<=rows;y++){ ctx2d.beginPath();ctx2d.moveTo(0,y*cellSize);ctx2d.lineTo(cols*cellSize,y*cellSize);ctx2d.stroke(); }

    ctx2d.fillStyle = '#f4c542';
    for(const a of liveApples.values()){
      const cx = a.x*cellSize+cellSize/2, cy = a.y*cellSize+cellSize/2;
      const r = Math.max(2, cellSize*0.32);
      ctx2d.beginPath(); ctx2d.arc(cx,cy,r,0,Math.PI*2); ctx2d.fill();
    }

    const gameTimeNow = currentGameTime();
    for(const s of liveSnakes.values()){
      const palette = STAGE_COLORS[s.species] ? STAGE_COLORS[s.species][lifeStage(s.birth, gameTimeNow)] : STAGE_COLORS.red.mid;
      for(let i=s.segments.length-1;i>=0;i--){
        const seg = s.segments[i];
        ctx2d.fillStyle = i===0 ? palette.head : palette.body;
        const pad = i===0 ? 0.5 : 1;
        ctx2d.fillRect(seg.x*cellSize+pad, seg.y*cellSize+pad, cellSize-pad*2, cellSize-pad*2);
      }
    }
  }

  function updateStats(){
    let red=0, blue=0;
    for(const s of liveSnakes.values()){ if(s.species==='red') red++; else if(s.species==='blue') blue++; }
    document.getElementById('redPop').textContent = red;
    document.getElementById('bluePop').textContent = blue;
    document.getElementById('applesEaten').textContent = appleEatenCount;
    updateClock(currentGameTime());
    if(startedAt){
      document.getElementById('startedMeta').textContent = 'Broadcast started ' + new Date(startedAt).toLocaleString();
    }
  }

  async function poll(){
    try{
      const res = await fetch('/api/state', {cache:'no-store'});
      if(res.status === 202){ return; }
      if(!res.ok) throw new Error('bad status '+res.status);
      const data = await res.json();
      offlineMsg.style.display = 'none';
      cols = data.cols; rows = data.rows; lifespanMs = data.lifespanMs;
      startedAt = data.startedAt;
      if(data.packet){
        loadPacket(data.packet, data.appleEatenCount - data.packet.events.filter(e=>e[0]==='m'&&e[5]).length);
      } else if(liveSnakes.size === 0){
        liveSnakes = new Map(data.snakes.map(s => [s.id, { species: s.species, birth: s.birth, segments: s.segments }]));
        liveApples = new Map(data.apples.map(a => [a.x+','+a.y, a]));
        appleEatenCount = data.appleEatenCount;
        playback = { events: [], windowStartGameTime: data.gameTime, windowMs: 0, clientAnchorMs: performance.now(), appliedIndex: 0 };
      }
    }catch(e){
      offlineMsg.style.display = 'block';
    }
  }

  function frameLoop(){
    stepPlayback();
    render();
    updateStats();
    requestAnimationFrame(frameLoop);
  }

  poll();
  setInterval(poll, 20000);
  requestAnimationFrame(frameLoop);
})();
</script>

</body>
</html>
